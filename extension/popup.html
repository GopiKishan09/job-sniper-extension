<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Sniper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <main class="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img class="mark" src="icons/icon128.png" alt="" width="34" height="34">
        <div>
          <h1>Job Sniper</h1>
          <p class="tagline" id="version"></p>
        </div>
      </div>
      <div class="pill" id="livePill" data-live="false">
        <span class="pill-dot"></span>
        <span id="livePillText">Idle</span>
      </div>
    </header>

    <!-- Not on LinkedIn Jobs -->
    <section id="emptyState" class="glass empty hidden">
      <div class="empty-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="18" height="13" rx="2.5"/>
          <path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 12.5h18"/>
        </svg>
      </div>
      <h2 class="empty-title">Open LinkedIn Jobs to start</h2>
      <p class="empty-text">Filters apply to the job search in your current tab.</p>
      <button class="btn-primary" id="openJobsBtn" type="button">
        Open LinkedIn Jobs
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button class="btn-text hidden" id="stopElsewhereBtn" type="button">Stop auto-refresh on the other tab</button>
    </section>

    <div id="mainContent" class="hidden">
      <!-- Auto refresh -->
      <section class="glass card hero">
        <div class="row">
          <div>
            <h2 class="card-title">Auto-refresh</h2>
            <p class="card-sub" id="refreshSub">Reload this search on a timer</p>
          </div>
          <label class="switch switch-lg">
            <input type="checkbox" id="autoRefreshToggle" aria-label="Auto-refresh">
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>
        <div class="segmented" id="intervalGroup" role="radiogroup" aria-label="Refresh interval">
          <span class="segmented-glider" aria-hidden="true"></span>
          <button type="button" role="radio" data-interval="0.5">30s</button>
          <button type="button" role="radio" data-interval="1">1m</button>
          <button type="button" role="radio" data-interval="2">2m</button>
          <button type="button" role="radio" data-interval="5">5m</button>
        </div>
      </section>

      <!-- Posted within -->
      <section class="glass card">
        <div class="card-head">
          <h2 class="card-title">Posted within</h2>
          <span class="card-hint" id="timeHint">Any time</span>
        </div>
        <div class="chip-grid" id="timeGroup">
          <button type="button" class="chip" data-seconds="60">1<small>m</small></button>
          <button type="button" class="chip" data-seconds="300">5<small>m</small></button>
          <button type="button" class="chip" data-seconds="600">10<small>m</small></button>
          <button type="button" class="chip" data-seconds="1800">30<small>m</small></button>
          <button type="button" class="chip" data-seconds="3600">1<small>h</small></button>
          <button type="button" class="chip" data-seconds="86400">24<small>h</small></button>
          <button type="button" class="chip" data-seconds="604800">1<small>w</small></button>
        </div>
        <form class="custom" id="customForm" novalidate>
          <div class="field" id="customField">
            <input type="number" id="customMinutes" min="1" max="43200" step="1" inputmode="numeric" placeholder="Custom" aria-label="Custom minutes">
            <span class="field-suffix">min</span>
          </div>
          <button type="submit" class="btn-ghost" id="customApply">Apply</button>
        </form>
        <p class="field-error hidden" id="customError">Enter whole minutes, 1–43200.</p>
      </section>

      <!-- Filters -->
      <section class="glass card">
        <div class="card-head">
          <h2 class="card-title">Work type</h2>
        </div>
        <div class="chip-row" id="workTypeGroup">
          <button type="button" class="chip chip-text" data-value="2">Remote</button>
          <button type="button" class="chip chip-text" data-value="3">Hybrid</button>
          <button type="button" class="chip chip-text" data-value="1">On-site</button>
        </div>

        <div class="card-head spaced">
          <h2 class="card-title">Experience</h2>
        </div>
        <div class="chip-row chip-row-3" id="experienceGroup">
          <button type="button" class="chip chip-text" data-value="1">Internship</button>
          <button type="button" class="chip chip-text" data-value="2">Entry</button>
          <button type="button" class="chip chip-text" data-value="3">Associate</button>
          <button type="button" class="chip chip-text" data-value="4">Mid-Senior</button>
          <button type="button" class="chip chip-text" data-value="5">Director</button>
          <button type="button" class="chip chip-text" data-value="6">Executive</button>
        </div>

        <div class="divider"></div>

        <div class="toggle-pair">
          <label class="toggle-cell">
            <span class="row-label">Easy Apply</span>
            <span class="switch">
              <input type="checkbox" id="easyApplyToggle" aria-label="Easy Apply only">
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </span>
          </label>
          <label class="toggle-cell">
            <span class="row-label">Newest first</span>
            <span class="switch">
              <input type="checkbox" id="sortLatestToggle" aria-label="Sort by most recent">
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </span>
          </label>
          <label class="toggle-cell" title="Hide sponsored listings from the results">
            <span class="row-label">Hide promoted</span>
            <span class="switch">
              <input type="checkbox" id="hidePromotedToggle" aria-label="Hide promoted jobs">
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </span>
          </label>
          <label class="toggle-cell" title="Hide jobs you've already opened">
            <span class="row-label">Hide viewed</span>
            <span class="switch">
              <input type="checkbox" id="hideViewedToggle" aria-label="Hide jobs you've already viewed">
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </span>
          </label>
        </div>
      </section>

      <!-- Summary -->
      <footer class="summary">
        <span class="summary-text" id="activeFiltersList">No filters applied</span>
        <button type="button" class="btn-text" id="clearAllBtn">Reset all</button>
      </footer>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
